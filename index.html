<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF9"/>
    <meta name="description" content="Aurum - personal expense tracker. Track spending, set budgets, and get advice grounded in your own transactions."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="Aurum"/>
    <meta property="og:title"       content="Aurum - Expense Tracker"/>
    <meta property="og:description" content="Track spending, set budgets, and understand where your money goes."/>
    <meta property="og:type"        content="website"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <title>Aurum - Expense Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('aurum_theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C0C0D');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>

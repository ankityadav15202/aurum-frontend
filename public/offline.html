<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aurum - Offline</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { color-scheme: light dark; --bg:#FAFAF9; --text:#1C1917; --text-2:#57534E; --primary:#1C1917; --primary-fg:#FFFFFF; --accent:#A16207; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0C0C0D; --text:#EDEDEC; --text-2:#A1A1A6; --primary:#EDEDEC; --primary-fg:#0C0C0D; --accent:#D4A94A; }
    }
    body { background:var(--bg); color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; -webkit-font-smoothing:antialiased; }
    .mark { width:40px; height:40px; border-radius:9px; background:var(--accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font:600 24px Georgia, serif; margin-bottom:24px; }
    h1 { font-size:20px; font-weight:600; letter-spacing:-0.015em; margin-bottom:8px; }
    p  { font-size:14px; color:var(--text-2); line-height:1.6; max-width:320px; margin:0 auto 24px; }
    button { background:var(--primary); color:var(--primary-fg); border:0; height:38px; padding:0 16px; border-radius:6px; cursor:pointer; font:500 14px inherit; font-family:inherit; }
  </style>
</head>
<body>
  <div>
    <div class="mark">A</div>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to keep your Aurum data in sync.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aurum — Offline</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#080C14; color:#E8DCC8; font-family:Georgia,serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
    .icon { font-size:64px; margin-bottom:24px; }
    h1 { font-size:28px; color:#C9A84C; margin-bottom:12px; letter-spacing:1px; }
    p  { font-size:14px; color:#6B7A8D; font-family:monospace; line-height:1.8; max-width:340px; margin:0 auto 28px; }
    button { background:linear-gradient(135deg,#C9A84C,#E8C66B); color:#080C14; border:none; padding:12px 28px; border-radius:10px; cursor:pointer; font-weight:700; font-size:13px; font-family:monospace; }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>You are offline</h1>
    <p>Reconnect to the internet to continue syncing your financial data with Aurum.</p>
    <button onclick="window.location.reload()">Try Again →</button>
  </div>
</body>
</html>
